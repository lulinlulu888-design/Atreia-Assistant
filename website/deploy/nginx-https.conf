limit_req_zone $binary_remote_addr zone=atreia_download:1m rate=6r/m;

server {
    listen 80;
    server_name a2go.cc www.a2go.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://a2go.cc$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.a2go.cc;
    ssl_certificate /etc/letsencrypt/live/a2go.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a2go.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://a2go.cc$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name a2go.cc;
    ssl_certificate /etc/letsencrypt/live/a2go.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a2go.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/atreia/www/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /_nuxt/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /updates/latest.json { add_header Cache-Control "no-cache"; }
    location = /api/download {
        client_max_body_size 256;
        limit_req zone=atreia_download burst=3 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location = /api/downloads {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }
    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
