name: Publish Atreia release
on:
  push:
    tags: ['v2.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-release:
    if: ${{ !endsWith(github.ref_name, '-downloads') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup default 1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version and prepare audited components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          New-Item -ItemType Directory -Force release-stage | Out-Null
          Invoke-WebRequest 'https://github.com/lulinlulu888-design/Atreia-Assistant/releases/download/v2.0.51/Atreia-Assistant_2.0.51_build-materials.zip' -OutFile release-stage/base.zip
          if ((Get-FileHash release-stage/base.zip).Hash -ne 'B7DAB6B9AC30C92A9BF17E3DD5B6117272E9147E8940C7763CEEE28937A4D219') { throw 'Component materials hash mismatch' }
          Expand-Archive release-stage/base.zip release-stage/materials
          $seed = "Atreia-Assistant_${version}_localization-sources.zip"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Release listing failed' }
          $drafts = @($releases | Where-Object { $_.draft -and $_.name -eq "亚特雷亚助手 $version · Steam 日文入口修复，PURPLE 沿用原方案" })
          if ($drafts.Count -ne 1) { throw 'Expected exactly one named release draft' }
          $draftRef = $drafts[0].tag_name
          if ($draftRef -ne $env:GITHUB_REF_NAME -and $draftRef -notmatch '^untagged-[a-f0-9]+$') { throw 'Unexpected draft tag' }
          "RELEASE_DRAFT_REF=$draftRef" >> $env:GITHUB_ENV
          $draft = gh release view $draftRef --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $draft.isDraft -or @($draft.assets).Count -ne 1 -or $draft.assets[0].name -ne $seed) { throw 'Expected an unpublished draft containing only the reviewed sources' }
          gh release download $draftRef --repo $env:GITHUB_REPOSITORY --pattern $seed --dir release-stage
          if ($LASTEXITCODE) { throw 'Source download failed' }
          $approved = Get-Content "releases/localization-$version.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash "release-stage/$seed").Hash.ToLowerInvariant() -cne $approved.source_archive_sha256) { throw 'Unreviewed source archive' }
          Expand-Archive "release-stage/$seed" release-stage/materials/localization-inputs/japanese-entry
          python -m pip install -r localization/requirements-build.txt
          if ($LASTEXITCODE) { throw 'Build dependency installation failed' }
          python -X utf8 -m unittest discover -s tests -q
          if ($LASTEXITCODE) { throw 'Python tests failed' }
          ./prepare-release-localization.ps1 -Inputs release-stage/materials/localization-inputs/japanese-entry -BaseComponent release-stage/materials/component -Python (Get-Command python).Source -Destination release-stage/prepared
          if ($LASTEXITCODE) { throw 'Split-client localization preparation failed' }
          Copy-Item release-stage/prepared/component/* desktop/src-tauri/vendor/localization/ -Recurse -Force
          Copy-Item release-stage/materials/notices/* desktop/src-tauri/vendor/notices/ -Recurse -Force
          python -X utf8 prepare-python-notices.py desktop/src-tauri/vendor/notices/japanese-helper
          if ($LASTEXITCODE) { throw 'Python runtime notices failed' }
          Copy-Item release-stage/prepared release-stage/materials/japanese-entry -Recurse
          Copy-Item desktop/src-tauri/vendor/notices/japanese-helper release-stage/materials/notices/japanese-helper -Recurse
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test and build installer
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE) { throw 'Frontend build failed' }
          node --test tests/*.test.cjs tests/*.test.mjs
          if ($LASTEXITCODE) { throw 'Frontend tests failed' }
          ../test-localization-safety.ps1
          if ($LASTEXITCODE) { throw 'Localization safety failed' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { throw 'Rust tests failed' }
          npm run tauri -- build --bundles msi --ci
          if ($LASTEXITCODE) { throw 'Installer build failed' }
      - name: Package reproducible materials
        run: |
          $version = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force release-stage/publish | Out-Null
          $installers = @(Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi)
          if ($installers.Count -ne 1) { throw 'Expected one installer' }
          ./test-installer-shortcut.ps1 -MsiPath $installers[0].FullName
          if ($LASTEXITCODE) { throw 'Installer shortcut check failed' }
          Copy-Item $installers[0].FullName "release-stage/publish/Atreia-Assistant_${version}_x64.msi"
          git archive --format=zip --output=release-stage/materials/application-source.zip HEAD
          if ($LASTEXITCODE) { throw 'Source archive failed' }
          Copy-Item "releases/BUILD-$version.md" release-stage/materials/BUILD.md
          $compatibility = Get-Content "releases/compatibility-$version.json" -Raw | ConvertFrom-Json
          $baseBuild = Get-Content release-stage/materials/build.json -Raw | ConvertFrom-Json
          [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            base_materials_version = '2.0.51'
            cargo_source_packages = $baseBuild.cargo_source_packages
            verified_game_builds = $compatibility.verified_game_builds
            localization_sources = (Get-Content "releases/localization-$version.json" -Raw | ConvertFrom-Json)
            steam = (Get-Content release-stage/prepared/bundles/steam/bundle.json -Raw | ConvertFrom-Json)
            helper = (Get-Content release-stage/prepared/component/build.json -Raw | ConvertFrom-Json)
            purple_helper_sha256 = (Get-Content release-stage/prepared/component/purple/helper.sha256 -Raw).Trim()
          } | ConvertTo-Json -Depth 12 | Set-Content release-stage/materials/build.json -Encoding utf8
          Compress-Archive -Path release-stage/materials/* -DestinationPath "release-stage/publish/Atreia-Assistant_${version}_build-materials.zip"
          Get-ChildItem release-stage/publish | ForEach-Object { "$((Get-FileHash $_.FullName).Hash.ToLower())  $($_.Name)" } | Set-Content release-stage/publish/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: atreia-release-${{ env.RELEASE_VERSION }}
          path: release-stage/publish/*
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:RELEASE_DRAFT_REF --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $draft.isDraft -or @($draft.assets).Count -ne 1) { throw 'Release changed while building; refusing to publish or overwrite' }
          gh release upload $env:RELEASE_DRAFT_REF release-stage/publish/* --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'Asset upload failed; draft remains unpublished' }
          gh release edit $env:RELEASE_DRAFT_REF --tag $env:GITHUB_REF_NAME --verify-tag --repo $env:GITHUB_REPOSITORY --draft=false --title "亚特雷亚助手 $env:RELEASE_VERSION · Steam 日文入口修复，PURPLE 沿用原方案" --notes-file "releases/$env:RELEASE_VERSION.md" --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
  s3-downloads:
    needs: windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atreia-release-*
          merge-multiple: true
          path: release-downloads
      - name: Verify formal release and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v2\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Not a formal release") else "Formal release verified" end'
          cd release-downloads
          sed -i 's/\r$//' SHA256SUMS.txt
          installer="Atreia-Assistant_${version}_x64.msi"
          test -s "$installer"
          test "$(grep -Ec "^[a-f0-9]{64}  ${installer//./\\.}$" SHA256SUMS.txt)" = 1
          grep -E "^[a-f0-9]{64}  ${installer//./\\.}$" SHA256SUMS.txt | sha256sum --check --strict -
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::487694861369:role/AtreiaGitHubReleasePublisher
          aws-region: ap-southeast-1
          role-session-name: atreia-release-${{ github.run_id }}
          role-duration-seconds: 900
      - name: Upload official downloads and verify round trip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          installer="Atreia-Assistant_${version}_x64.msi"
          destination="s3://atreia-downloads-487694861369/releases/$GITHUB_REF_NAME"
          aws s3 cp "release-downloads/$installer" "$destination/$installer" --content-type application/octet-stream --no-progress
          aws s3 cp release-downloads/SHA256SUMS.txt "$destination/SHA256SUMS.txt" --content-type text/plain --no-progress
          mkdir round-trip
          aws s3 cp "$destination/$installer" "round-trip/$installer" --no-progress
          aws s3 cp "$destination/SHA256SUMS.txt" round-trip/SHA256SUMS.txt --no-progress
          cmp release-downloads/SHA256SUMS.txt round-trip/SHA256SUMS.txt
          cmp "release-downloads/$installer" "round-trip/$installer"
