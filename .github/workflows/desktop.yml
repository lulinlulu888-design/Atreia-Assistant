name: Atreia desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup default 1.93.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate frontend resources for tests
        run: npm run build
      - name: Frontend and launcher tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Translation source binding and coverage safety tests
        run: ../test-localization-safety.ps1
      - name: Native parser and application tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows desktop without driver or proprietary game assets
        run: npm run tauri build -- --no-bundle --debug
