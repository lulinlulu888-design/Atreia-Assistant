name: Combat core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup default 1.93.0
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --manifest-path backend/Cargo.toml --locked
      - name: End-to-end capture to backend tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ATREIA_BACKEND = Join-Path $PWD 'backend/target/debug/atreia-combat-backend.exe'
          python -m unittest discover -s tests -v
      - name: End-to-end capture to backend tests (Linux)
        if: runner.os == 'Linux'
        run: ATREIA_BACKEND="$PWD/backend/target/debug/atreia-combat-backend" python -m unittest discover -s tests -v
      - name: Frozen Windows development bundle smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python audit_dependencies.py --output dist/license-inventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-windows.ps1 -SkipBackendBuild -BackendPath (Join-Path $PWD 'backend/target/debug/atreia-combat-backend.exe')
      - name: Store synthetic smoke report only (no binary publication)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-synthetic-smoke-report
          path: |
            dist/dev-*/synthetic-self-test.json
            dist/license-inventory/
          if-no-files-found: error
