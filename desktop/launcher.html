<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>亚特雷亚助手</title>
  <link rel="stylesheet" href="/src/neumorphic.css">
  <link rel="stylesheet" href="/src/launcher.css">
  <link rel="stylesheet" href="/src/atreia.css">
</head>
<body class="launcher-body">
<main class="launcher-shell">
  <header class="launcher-brand">
    <div class="brand-emblem"><img src="/assets/atreia-mark.png" alt="" width="48" height="48"></div>
    <div class="brand-copy"><span class="eyebrow">ATREIA ASSISTANT</span><h1>亚特雷亚助手</h1><p>你的亚特雷亚，清晰一点。</p></div>
    <span class="version-badge">v2.0.58</span>
  </header>
  <section class="choices" aria-label="选择功能">
    <button id="radar-open" class="feature-card" type="button">
      <span class="card-top"><span class="feature-icon"><i data-lucide="radar" aria-hidden="true"></i></span><i class="card-arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></span>
      <span class="card-copy"><strong>宝箱雷达</strong><small>隐藏宝箱 · 距离与高度差</small></span>
      <span class="card-caption">探索附近宝箱 <i data-lucide="chevron-right" aria-hidden="true"></i></span>
    </button>
    <button id="combat" class="feature-card" type="button">
      <span class="card-top"><span class="feature-icon"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i></span><i class="card-arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></span>
      <span class="card-copy"><strong>战斗统计</strong><small>伤害、治疗与技能明细</small></span>
      <span class="card-caption">按需开启悬浮窗 <i data-lucide="chevron-right" aria-hidden="true"></i></span>
    </button>
    <button id="localization" class="feature-card" type="button">
      <span class="card-top"><span class="feature-icon"><i data-lucide="languages" aria-hidden="true"></i></span><i class="card-arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></span>
      <span class="card-copy"><strong>游戏汉化</strong><small>简体中文 · 检测、安装与还原</small></span>
      <span class="card-caption">支持 Steam 与 PURPLE <i data-lucide="chevron-right" aria-hidden="true"></i></span>
    </button>
  </section>
  <div class="launcher-status"><span class="status-dot" aria-hidden="true"></span><p id="status" role="status">Steam / Global · PURPLE</p><button id="npcap-download" class="npcap-link" type="button" aria-label="前往 Npcap 官网（在浏览器中打开）" hidden>前往 Npcap 官网</button><span class="local-badge">本地运行</span></div>
  <section class="update-strip" aria-label="助手更新">
    <span class="update-icon"><i data-lucide="refresh-cw" aria-hidden="true"></i></span>
    <div class="update-copy"><strong>助手更新</strong><span id="update-status" role="status">启动后自动检查新版本</span></div>
    <div class="update-actions"><button id="update-check" type="button">检查更新</button><button id="update-install" class="primary" type="button" hidden>下载并更新</button></div>
  </section>
  <footer><span>战斗统计基于 A2Tools · 开源社区版</span><span>为每一次冒险</span></footer>
</main>
<script src="/vendor/lucide.min.js"></script>
<script src="/src/js/atreiaLauncher.js"></script>
<script src="/src/js/atreiaUpdate.js"></script>
</body>
</html>
