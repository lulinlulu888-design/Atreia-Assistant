name = "a2tools-log-service"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# No public URL. The a2tools.app Worker reaches this through a service binding
# ("LOG_SERVICE" in its wrangler.jsonc), and nothing else can.
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# Secret, set once:  npx wrangler secret put LOG_SERVICE_KEY
# The same value goes on the site Worker, which sends it on every call.
