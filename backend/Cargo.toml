[package]
name = "atreia-combat-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Offline AION2 combat protocol adapter for Atreia Assistant"

[dependencies]
a2tools-dps-meter = { git = "https://github.com/taengu/A2Tools-DPS-Meter.git", rev = "70aade3fef1ef8b15fe5ce3d27cfdbfc5f854b98", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
